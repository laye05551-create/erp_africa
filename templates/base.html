<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERP Africa{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }

        /* SIDEBAR DESKTOP */
        .sidebar {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            position: fixed;
            width: 220px;
            top: 0;
            left: 0;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            display: block;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .sidebar a:hover, .sidebar a.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .brand { color: #fff; font-weight: bold; font-size: 1.2rem; margin-bottom: 20px; display: block; }
        .main-content { margin-left: 220px; padding: 30px; }
        .card { border-radius: 15px; border: none; box-shadow: 0 2px 15px rgba(0,0,0,0.08); }
        .logout-btn { color: #ff6b6b !important; margin-top: 20px; }

        /* MOBILE NAVBAR */
        .mobile-navbar {
            display: none;
            background: linear-gradient(90deg, #1a1a2e, #16213e);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 200;
        }
        .hamburger {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 260px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .main-content { margin-left: 0; padding: 15px; }
            .mobile-navbar { display: flex; justify-content: space-between; align-items: center; }
        }

        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>

<!-- MOBILE NAVBAR -->
<div class="mobile-navbar">
    <button class="hamburger" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>
    <span style="color:white;font-weight:bold;">🌍 ERP Africa</span>
    <span style="color:#adb5bd;font-size:0.8rem;">{{ request.user.username }}</span>
</div>

<!-- OVERLAY -->
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <span class="brand d-none d-md-block">🌍 ERP Africa</span>
            <a href="/dashboard/" {% if active == 'dashboard' %}class="active"{% endif %}>
                <i class="bi bi-speedometer2 me-2"></i>Dashboard
            </a>
            <a href="/dashboard/ia/" {% if active == 'ia' %}class="active"{% endif %}>
                <i class="bi bi-robot me-2"></i>Analyse IA
            </a>
            <a href="/comptabilite/" {% if active == 'comptabilite' %}class="active"{% endif %}>
                <i class="bi bi-journal-text me-2"></i>Comptabilité
            </a>
            <a href="/stocks/" {% if active == 'stocks' %}class="active"{% endif %}>
                <i class="bi bi-box-seam me-2"></i>Stocks
            </a>
            <a href="/stocks/categories/" {% if active == 'categories' %}class="active"{% endif %}>
                <i class="bi bi-tags me-2"></i>Catégories
            </a>
            <a href="/clients/" {% if active == 'clients' %}class="active"{% endif %}>
                <i class="bi bi-people me-2"></i>Clients
            </a>
            <a href="/factures/" {% if active == 'factures' %}class="active"{% endif %}>
                <i class="bi bi-receipt me-2"></i>Factures
            </a>
            <a href="/entreprises/membres/" {% if active == 'membres' %}class="active"{% endif %}>
                <i class="bi bi-person-badge me-2"></i>Membres
            </a>
            {% if user.is_superuser %}
            <a href="/erp-admin-secret/"><i class="bi bi-gear me-2"></i>Administration</a>
            {% endif %}
            <form method="post" action="/logout/" style="margin:0">
                {% csrf_token %}
                <button type="submit" class="logout-btn" style="background:none;border:none;padding:10px 15px;width:100%;text-align:left;border-radius:10px;font-size:0.9rem;cursor:pointer;">
                    <i class="bi bi-box-arrow-left me-2"></i>Déconnexion
                </button>
            </form>
        </div>

        <!-- Contenu principal -->
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
}

window.addEventListener('offline', function() {
    document.body.insertAdjacentHTML('afterbegin',
        '<div id="offline-alert" style="position:fixed;top:0;left:0;right:0;background:#dc3545;color:white;text-align:center;padding:12px;z-index:9999;font-weight:bold;">' +
        '⚠️ Connexion internet perdue !</div>'
    );
});
window.addEventListener('online', function() {
    const alert = document.getElementById('offline-alert');
    if (alert) alert.remove();
});
</script>
{% block extra_script %}{% endblock %}
</body>
</html>
